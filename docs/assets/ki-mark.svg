<svg xmlns="http://www.w3.org/2000/svg" width="420" height="168" viewBox="0 0 420 168" role="img" aria-labelledby="title description">
  <title id="title">KI team mark</title>
  <desc id="description">Geometric block KI lettering with a saddle brown face, deep brown offset extrusion, and a repeating left-to-right light refraction.</desc>

  <defs>
    <g id="ki-blocks">
      <!-- K: a segmented vertical stem and stepped diagonal arms. -->
      <rect x="38" y="24" width="38" height="31"/>
      <rect x="38" y="58" width="38" height="25"/>
      <rect x="38" y="86" width="38" height="31"/>
      <rect x="38" y="120" width="38" height="25"/>
      <rect x="79" y="70" width="30" height="28"/>
      <rect x="101" y="53" width="31" height="25"/>
      <rect x="124" y="30" width="34" height="25"/>
      <rect x="101" y="93" width="31" height="25"/>
      <rect x="124" y="122" width="34" height="25"/>

      <!-- I: segmented caps and stem preserve the same terminal-grid rhythm. -->
      <rect x="202" y="24" width="132" height="31"/>
      <rect x="249" y="58" width="38" height="25"/>
      <rect x="249" y="86" width="38" height="31"/>
      <rect x="202" y="120" width="132" height="25"/>
    </g>

    <clipPath id="ki-face-clip" clipPathUnits="userSpaceOnUse">
      <rect x="38" y="24" width="38" height="31"/>
      <rect x="38" y="58" width="38" height="25"/>
      <rect x="38" y="86" width="38" height="31"/>
      <rect x="38" y="120" width="38" height="25"/>
      <rect x="79" y="70" width="30" height="28"/>
      <rect x="101" y="53" width="31" height="25"/>
      <rect x="124" y="30" width="34" height="25"/>
      <rect x="101" y="93" width="31" height="25"/>
      <rect x="124" y="122" width="34" height="25"/>
      <rect x="202" y="24" width="132" height="31"/>
      <rect x="249" y="58" width="38" height="25"/>
      <rect x="249" y="86" width="38" height="31"/>
      <rect x="202" y="120" width="132" height="25"/>
    </clipPath>

    <linearGradient id="shine-band" x1="0%" y1="0%" x2="100%" y2="0%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#f4d5b5" stop-opacity="0"/>
      <stop offset="28%" stop-color="#f4d5b5" stop-opacity="0.08"/>
      <stop offset="43%" stop-color="#f4d5b5" stop-opacity="0.46"/>
      <stop offset="50%" stop-color="#fff3df" stop-opacity="0.96"/>
      <stop offset="57%" stop-color="#d99a62" stop-opacity="0.56"/>
      <stop offset="68%" stop-color="#4a2c20" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4a2c20" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="refraction-edge" x1="0%" y1="0%" x2="100%" y2="0%" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#fff3df" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff3df" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#c27a43" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-glow" x="-80%" y="-20%" width="260%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @media (prefers-reduced-motion: reduce) {
        .shine-sweep { display: none; }
      }
    </style>
  </defs>

  <!-- Two offset layers create the outlined pseudo-3D depth from the reference. -->
  <use href="#ki-blocks" transform="translate(10 10)" fill="none" stroke="#4a2c20" stroke-width="4" stroke-linejoin="miter"/>
  <use href="#ki-blocks" transform="translate(5 5)" fill="none" stroke="#4a2c20" stroke-width="2" stroke-linejoin="miter" opacity="0.72"/>
  <use href="#ki-blocks" transform="translate(8 8)" fill="#4a2c20" opacity="0.98"/>

  <!-- Front face. Geometric primitives avoid font-dependent rendering. -->
  <use href="#ki-blocks" fill="#8b4513" stroke="#4a2c20" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- A clipped specular band crosses the front face, then pauses before looping. -->
  <g class="shine-sweep" clip-path="url(#ki-face-clip)" pointer-events="none">
    <g transform="skewX(-12)">
      <rect x="-120" y="8" width="92" height="154" fill="url(#shine-band)" opacity="0.9">
        <animate
          attributeName="x"
          values="-120;430;430"
          keyTimes="0;0.72;1"
          keySplines="0.22 0.08 0.25 1;0 0 1 1"
          calcMode="spline"
          dur="4.4s"
          repeatCount="indefinite"
        />
      </rect>
      <rect x="-146" y="8" width="18" height="154" fill="url(#refraction-edge)" filter="url(#soft-glow)" opacity="0.76">
        <animate
          attributeName="x"
          values="-146;404;404"
          keyTimes="0;0.72;1"
          keySplines="0.22 0.08 0.25 1;0 0 1 1"
          calcMode="spline"
          dur="4.4s"
          repeatCount="indefinite"
        />
      </rect>
    </g>
  </g>
</svg>
