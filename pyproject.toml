[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-copilot"
version = "0.1.0"
description = "Offline-first, state-aware conversational shopping agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
demo = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]
test = [
    "fastapi>=0.116,<1",
    "httpx2>=2.12,<3",
    "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
